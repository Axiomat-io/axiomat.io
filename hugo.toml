baseURL = 'https://axiomat.io/'
languageCode = 'en-us'
title = 'Axiomat — High-value software, low-friction experiences'
theme = "axiom"
enableRobotsTXT = true
description = "Axiomat builds software that does the work instead of handing it to you — starting with Ward, its first product."

# The theme ships demo content (posts, tags, categories). We don't use it, and
# taxonomy term pages would otherwise land in the sitemap as empty branded pages.
disableKinds = ['taxonomy', 'term']

[taxonomies]

[params]
description = "Axiomat builds software that does the work instead of handing it to you — starting with Ward, its first product."

# Endpoint the early-access form POSTs JSON to (Formspree, Formspark, a
# serverless function — anything that accepts {email, use_case, source}).
# While this is empty the form is hidden and CTAs fall back to email links.
formEndpoint = ""
contactEmail = "hello@axiomat.io"

# Where "Start free trial" sends people. Set this to Ward's signup URL once open
# signup ships (Ward#263) and every trial CTA points straight at the app. While it's
# empty the CTAs fall back to the early-access form on the page, so the button never
# promises a trial the visitor can't actually start.
appSignupURL = ""

[params.meta]
favicon = true
